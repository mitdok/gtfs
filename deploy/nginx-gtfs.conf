# Insert these locations in the dokasen.com TLS server block.
location /gtfs-api/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;
}

# The former gtfs2 endpoints are retired. Keep a safe browser redirect for the UI,
# but never redirect API writes to a different path.
location = /gtfs2 { return 301 /gtfs/; }
location ^~ /gtfs2/ { return 301 /gtfs/; }
location = /gtfs2-api { return 410; }
location ^~ /gtfs2-api/ { return 410; }
