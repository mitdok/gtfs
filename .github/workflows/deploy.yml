name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: gtfs-production
    environment: production
    steps:
      - name: Resolve revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @gtfs-studio/core build
          VITE_GTFS_API_BASE_URL=https://dokasen.com/gtfs-api \
            pnpm --filter @gtfs-studio/web exec vite build --base=/gtfs/
          pnpm --filter @gtfs-studio/api build
          git archive --format=zip --prefix=gtfs-studio/ "${{ steps.revision.outputs.sha }}" \
            -o "gtfs-studio-src-gtfs-${{ steps.revision.outputs.sha }}.zip"

      - name: Deploy frontend and API
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          rsync -a --delete --exclude 'dl/' packages/web/dist/ /var/www/html/gtfs/
          mkdir -p /var/www/html/gtfs/dl /var/www/gtfs-api/core /var/www/gtfs-api/api
          find /var/www/html/gtfs/dl -maxdepth 1 -type f -name 'gtfs-studio-src-gtfs-*.zip' -delete
          install -m 644 "gtfs-studio-src-gtfs-$REVISION.zip" /var/www/html/gtfs/dl/
          rsync -a --delete packages/core/dist packages/core/package.json /var/www/gtfs-api/core/
          rsync -a --delete packages/api/dist packages/api/bin packages/api/package.json /var/www/gtfs-api/api/
          install -m 644 deploy/api-package.json deploy/start.mjs /var/www/gtfs-api/
          cd /var/www/gtfs-api
          cp api-package.json package.json
          npm install --omit=dev --no-audit --no-fund
          mkdir -p node_modules/@gtfs-studio
          ln -sfn ../../core node_modules/@gtfs-studio/core
          export XDG_RUNTIME_DIR=/run/user/1000
          systemctl --user restart gtfs-api

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://dokasen.com/gtfs/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://dokasen.com/gtfs-api/health >/dev/null
