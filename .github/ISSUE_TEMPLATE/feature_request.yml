name: Feature request
description: 改善や新機能を提案する
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 利用者や運用上の課題を記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足
